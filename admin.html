<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RENESA Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#20242b;font-family:system-ui,Arial,sans-serif}
button,input,textarea,select{font:inherit}button{background:#d71920;color:white;border:0;border-radius:8px;padding:11px 14px;font-weight:700;cursor:pointer}
.secondary{background:#e5e7eb;color:#111}.wrap{max-width:1100px;margin:24px auto;padding:0 14px}.brand{font-size:27px;font-weight:900;color:#d71920}
.panel{background:white;border-radius:14px;padding:18px;margin-top:16px;box-shadow:0 4px 20px #00000008}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.form input,.form textarea,.form select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:8px;background:white}
.full{grid-column:1/-1}.note{font-size:13px;color:#64748b;line-height:1.6;overflow-wrap:anywhere}.hidden{display:none!important}
.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:620px}td,th{text-align:left;padding:10px;border-bottom:1px solid #e5e7eb;font-size:14px;vertical-align:top}
td img{width:50px;height:45px;object-fit:contain}.actions{display:flex;gap:6px}.actions button{padding:7px 10px}
@media(max-width:600px){.form{grid-template-columns:1fr}.full{grid-column:auto}.panel{padding:14px}}
</style>
</head>
<body>
<main class="wrap">
<div class="brand">RENESA <span style="color:#334155;font-size:17px">Admin Panel</span></div>
<section class="panel" id="loginPanel">
<h2>Admin Login</h2>
<form id="loginForm" class="form">
<input class="full" name="email" type="email" placeholder="Admin email" required>
<input class="full" name="password" type="password" placeholder="Password" required>
<button class="full" id="loginButton">Login</button>
</form>
<p id="loginMsg" class="note">Supabase account দিয়ে Login করুন।</p>
</section>
<section id="app" class="hidden">
<div class="panel">
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2>পণ্য ম্যানেজমেন্ট</h2><button id="logout" class="secondary" type="button">Logout</button></div>
<form id="productForm" class="form">
<input name="name" placeholder="পণ্যের নাম" maxlength="160" required>
<input name="price" type="number" min="0" step=".01" placeholder="দাম (৳)" required>
<input name="old_price" type="number" min="0" step=".01" placeholder="আগের দাম">
<input name="stock" type="number" min="0" step="1" placeholder="স্টক" required>
<select name="category"><option>ইলেকট্রনিক্স</option><option>ফ্যাশন</option><option>বিউটি</option><option>হোম</option><option>অন্যান্য</option></select>
<input name="image" type="file" accept="image/*">
<textarea name="description" class="full" placeholder="পণ্যের বিবরণ" rows="3"></textarea>
<button id="save" class="full">পণ্য যোগ করুন</button>
<button id="cancel" type="button" class="secondary full hidden">Edit বাতিল</button>
</form>
<p id="productMsg" class="note"></p>
<div class="tablewrap"><table><thead><tr><th>ছবি</th><th>পণ্য</th><th>দাম</th><th>স্টক</th><th>কাজ</th></tr></thead><tbody id="products"></tbody></table></div>
</div>
<div class="panel">
<h2>অর্ডার ম্যানেজমেন্ট</h2><p class="note">অর্ডার দেখা ও Status পরিবর্তন।</p>
<div class="tablewrap"><table><thead><tr><th>Order</th><th>Customer</th><th>ফোন / ঠিকানা</th><th>পণ্য / মোট</th><th>Status</th><th>Update</th></tr></thead><tbody id="orders"></tbody></table></div>
<p id="orderMsg" class="note"></p>
</div>
</section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://amanyzzaxbajxqtneqvl.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_9r0ndhBi0ykwmHzb40mvYQ_aXRjoq_Q';
const ready=SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('YOUR_')&&SUPABASE_PUBLISHABLE_KEY.length>25&&!SUPABASE_PUBLISHABLE_KEY.includes('YOUR_');
const db=ready?supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY):null;
let list=[],editId=null;
const $=id=>document.getElementById(id);
const money=n=>'৳'+Number(n||0).toLocaleString('en-BD',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function admin(){
if(!db){$('loginMsg').textContent='Supabase URL ও Publishable Key বসান।';return false}
const {data:{user},error:authError}=await db.auth.getUser();
if(authError||!user)return false;
const {data,error}=await db.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();
if(error){console.error(error);$('loginMsg').textContent='Admin যাচাই হয়নি: '+error.message;return false}
return !!data;
}
async function init(){
if(!db){$('loginMsg').textContent='কোডে Supabase URL ও Publishable Key বসান।';return}
try{
if(await admin()){
$('loginPanel').classList.add('hidden');$('app').classList.remove('hidden');
await Promise.all([loadProducts(),loadOrders()]);
}else{$('loginPanel').classList.remove('hidden');$('app').classList.add('hidden')}
}catch(e){$('loginMsg').textContent='সমস্যা: '+e.message}
}
$('loginForm').onsubmit=async e=>{
e.preventDefault();
if(!db){$('loginMsg').textContent='Supabase URL ও Publishable Key আগে বসান।';return}
const btn=$('loginButton');btn.disabled=true;$('loginMsg').textContent='Login হচ্ছে...';
try{
const f=new FormData(e.target);
const {error}=await db.auth.signInWithPassword({email:String(f.get('email')).trim(),password:f.get('password')});
if(error){$('loginMsg').textContent='Login হয়নি: '+error.message;return}
if(await admin()){
$('loginPanel').classList.add('hidden');$('app').classList.remove('hidden');
await Promise.all([loadProducts(),loadOrders()]);
}else{await db.auth.signOut();$('loginMsg').textContent='এই account Admin হিসেবে অনুমোদিত নয়। UID যাচাই করুন।'}
}catch(err){$('loginMsg').textContent='সমস্যা: '+err.message}
finally{btn.disabled=false}
};
$('logout').onclick=async()=>{if(db)await db.auth.signOut();location.reload()};
async function loadProducts(){
const {data,error}=await db.from('products').select('*').order('created_at',{ascending:false});
if(error){$('productMsg').textContent='পণ্য লোড হয়নি: '+error.message;return}
list=data||[];
$('products').innerHTML=list.map(p=>'<tr><td><img src="'+esc(p.image_url||'https://placehold.co/80x60?text=R')+'" alt=""></td><td>'+esc(p.name)+'<br><small>'+esc(p.category)+'</small></td><td>'+money(p.price)+'</td><td>'+Number(p.stock||0)+'</td><td><div class="actions"><button type="button" data-edit="'+esc(p.id)+'">Edit</button><button type="button" class="secondary" data-del="'+esc(p.id)+'">Delete</button></div></td></tr>').join('');
$('products').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));
$('products').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>del(b.dataset.del));
if(!list.length)$('productMsg').textContent='এখনো কোনো পণ্য নেই।';
}
function edit(id){
const p=list.find(x=>String(x.id)===String(id));if(!p)return;
editId=p.id;const f=$('productForm');
['name','price','old_price','stock','category','description'].forEach(k=>{if(f.elements[k])f.elements[k].value=p[k]??''});
f.elements.image.value='';$('save').textContent='পরিবর্তন সংরক্ষণ করুন';$('cancel').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'});
}
$('cancel').onclick=()=>{editId=null;$('productForm').reset();$('save').textContent='পণ্য যোগ করুন';$('cancel').classList.add('hidden')};
async function upload(file){
if(!file)return null;
if(!file.type.startsWith('image/')||file.size>5*1024*1024)throw Error('ছবি হতে হবে এবং 5MB-এর কম হতে হবে।');
const path=Date.now()+'-'+crypto.randomUUID()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
const {error}=await db.storage.from('renesa-products').upload(path,file,{contentType:file.type});
if(error)throw error;
return db.storage.from('renesa-products').getPublicUrl(path).data.publicUrl;
}
$('productForm').onsubmit=async e=>{
e.preventDefault();
if(!await admin()){$('productMsg').textContent='Admin অনুমতি যাচাই হয়নি। আবার Login করুন।';return}
const f=e.target,d=new FormData(f),btn=$('save');btn.disabled=true;
try{
const file=d.get('image'),imageUrl=file&&file.size?await upload(file):null;
const row={name:String(d.get('name')).trim(),price:Number(d.get('price')),old_price:d.get('old_price')?Number(d.get('old_price')):null,stock:Number(d.get('stock')),category:d.get('category'),description:String(d.get('description')||'').trim(),is_active:true};
if(imageUrl)row.image_url=imageUrl;
if(editId){const {error}=await db.from('products').update(row).eq('id',editId);if(error)throw error}
else{row.image_url=row.image_url||'https://placehold.co/400x300?text=RENESA';const {error}=await db.from('products').insert(row);if(error)throw error}
$('productMsg').textContent=editId?'পণ্য আপডেট হয়েছে।':'পণ্য যোগ হয়েছে।';
f.reset();editId=null;btn.textContent='পণ্য যোগ করুন';$('cancel').classList.add('hidden');await loadProducts();
}catch(err){console.error(err);$('productMsg').textContent='কাজ হয়নি: '+err.message}
finally{btn.disabled=false}
};
async function del(id){
if(!confirm('পণ্যটি মুছবেন?'))return;
if(!await admin()){$('productMsg').textContent='Admin অনুমতি যাচাই হয়নি।';return}
const {error}=await db.from('products').delete().eq('id',id);
if(error){$('productMsg').textContent='Delete হয়নি: '+error.message;return}
$('productMsg').textContent='পণ্য Delete হয়েছে।';await loadProducts();
}
async function loadOrders(){
const {data,error}=await db.from('orders').select('*').order('created_at',{ascending:false}).limit(100);
if(error){$('orderMsg').textContent='Order লোড হয়নি: '+error.message;return}
$('orders').innerHTML=(data||[]).map(o=>'<tr><td>#'+esc(o.id)+'<br><small>'+esc(o.created_at||'')+'</small></td><td>'+esc(o.customer_name)+'</td><td>'+esc(o.phone)+'<br>'+esc(o.address)+'</td><td>'+((Array.isArray(o.items)?o.items:[]).map(i=>esc(i.name)+' × '+esc(i.quantity)).join('<br>'))+'<br><b>'+money(o.total)+'</b></td><td>'+esc(o.status)+'</td><td><select data-s="'+esc(o.id)+'">'+['pending','confirmed','processing','shipped','delivered','cancelled'].map(s=>'<option value="'+s+'" '+(o.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select><button type="button" data-save="'+esc(o.id)+'" style="margin-top:5px">Save</button></td></tr>').join('');
$('orders').querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{
if(!await admin()){$('orderMsg').textContent='Admin অনুমতি যাচাই হয়নি।';return}
const id=b.dataset.save,sel=$('orders').querySelector('[data-s="'+CSS.escape(id)+'"]');
const {error}=await db.from('orders').update({status:sel.value}).eq('id',id);
if(error)$('orderMsg').textContent='Update হয়নি: '+error.message;
else{$('orderMsg').textContent='Order #'+id+' update হয়েছে';await loadOrders()}
});
if(!data||!data.length)$('orderMsg').textContent='এখনো কোনো Order নেই।';
}
init();
</script>
</body>
</html>
