<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RENESA Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#20242b;font-family:system-ui,Arial,sans-serif}button,input,textarea,select{font:inherit}button{background:#d71920;color:white;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.secondary{background:#e5e7eb;color:#111}.wrap{max-width:1100px;margin:25px auto;padding:0 15px}.brand{font-size:27px;font-weight:900;color:#d71920}.panel{background:white;border-radius:14px;padding:20px;margin-top:16px;box-shadow:0 4px 20px #00000008}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.form input,.form textarea,.form select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:8px}.full{grid-column:1/-1}.note{font-size:13px;color:#64748b;line-height:1.5}.hidden{display:none!important}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:620px}td,th{text-align:left;padding:10px;border-bottom:1px solid #e5e7eb;font-size:14px}td img{width:50px;height:45px;object-fit:contain}.actions{display:flex;gap:6px}.actions button{padding:7px 10px}.orderpanel{margin-top:22px}@media(max-width:600px){.form{grid-template-columns:1fr}.full{grid-column:auto}.panel{padding:14px}}</style></head><body><main class="wrap"><div class="brand">RENESA <span style="color:#334155;font-size:17px">Admin Panel</span></div><section class="panel" id="loginPanel"><h2>Admin Login</h2><form id="loginForm" class="form"><input class="full" name="email" type="email" placeholder="Admin email" required><input class="full" name="password" type="password" placeholder="Password" required><button class="full">Login</button></form><p id="loginMsg" class="note">প্রথমে Supabase Auth-এ user তৈরি করে SQL-এ admin হিসেবে যুক্ত করুন।</p></section><section id="app" class="hidden"><div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2>পণ্য ম্যানেজমেন্ট</h2><button id="logout" class="secondary">Logout</button></div><form id="productForm" class="form"><input name="name" placeholder="পণ্যের নাম" required maxlength="160"><input name="price" type="number" min="0" step=".01" placeholder="দাম (৳)" required><input name="old_price" type="number" min="0" step=".01" placeholder="আগের দাম (ঐচ্ছিক)"><input name="stock" type="number" min="0" step="1" placeholder="স্টক" required><select name="category"><option>ইলেকট্রনিক্স</option><option>ফ্যাশন</option><option>বিউটি</option><option>হোম</option><option>অন্যান্য</option></select><input name="image" type="file" accept="image/*"><textarea name="description" class="full" placeholder="বিবরণ" rows="3"></textarea><button id="save" class="full">পণ্য যোগ করুন</button><button id="cancel" type="button" class="secondary full hidden">Edit বাতিল</button></form><p id="productMsg" class="note"></p><div class="tablewrap"><table><thead><tr><th>ছবি</th><th>পণ্য</th><th>দাম</th><th>স্টক</th><th>কাজ</th></tr></thead><tbody id="products"></tbody></table></div></div><div class="panel orderpanel"><h2>অর্ডার ম্যানেজমেন্ট</h2><p class="note">শুধু admin customer-এর ফোন ও ঠিকানা দেখতে পারবেন।</p><div class="tablewrap"><table><thead><tr><th>Order</th><th>Customer</th><th>ফোন / ঠিকানা</th><th>পণ্য / মোট</th><th>Status</th><th>Update</th></tr></thead><tbody id="orders"></tbody></table></div><p id="orderMsg" class="note"></p></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='YOUR_SUPABASE_URL';const SUPABASE_PUBLISHABLE_KEY='sb_publishable_9r0ndhBi0ykwmHzb40mvYQ_aXRjoq_Q';const ready=SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('YOUR_')&&SUPABASE_PUBLISHABLE_KEY.length>25&&!SUPABASE_PUBLISHABLE_KEY.includes('YOUR_');const db=ready?supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY):null;let list=[],editId=null;const $=id=>document.getElementById(id),money=n=>'৳'+Number(n||0).toLocaleString('en-BD',{maximumFractionDigits:2}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function admin(){if(!db){$('loginMsg').textContent='এই ফাইলে Supabase URL ও publishable key বসান।';return false}let {data:{user}}=await db.auth.getUser();if(!user)return false;let {data,error}=await db.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(error)console.error(error);return !!data}async function init(){if(await admin()){$('loginPanel').classList.add('hidden');$('app').classList.remove('hidden');await Promise.all([loadProducts(),loadOrders()])}else{$('loginPanel').classList.remove('hidden');$('app').classList.add('hidden')}}$('loginForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),{error}=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error){$('loginMsg').textContent='Login হয়নি: '+error.message;return}await init();if($('app').classList.contains('hidden'))$('loginMsg').textContent='এই user admin নয়। SQL-এ admin_users টেবিলে যুক্ত করুন।'};$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
async function loadProducts(){let {data,error}=await db.from('products').select('*').order('created_at',{ascending:false});if(error){$('productMsg').textContent=error.message;return}list=data||[];$('products').innerHTML=list.map(p=>`<tr><td><img src="${esc(p.image_url||'https://placehold.co/80x60?text=R')}"></td><td>${esc(p.name)}<br><small>${esc(p.category)}</small></td><td>${money(p.price)}</td><td>${p.stock}</td><td><div class="actions"><button data-edit="${p.id}">Edit</button><button class="secondary" data-del="${p.id}">Delete</button></div></td></tr>`).join('');$('products').querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit));$('products').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>del(b.dataset.del))}function edit(id){let p=list.find(x=>String(x.id)===String(id)),f=$('productForm');if(!p)return;editId=p.id;['name','price','old_price','stock','category','description'].forEach(k=>f.elements[k].value=p[k]??'');f.elements.image.value='';$('save').textContent='পরিবর্তন সংরক্ষণ করুন';$('cancel').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})}$('cancel').onclick=()=>{editId=null;$('productForm').reset();$('save').textContent='পণ্য যোগ করুন';$('cancel').classList.add('hidden')};async function upload(file){if(!file)return null;if(!file.type.startsWith('image/')||file.size>5*1024*1024)throw Error('ছবি হতে হবে এবং 5MB-এর কম হতে হবে।');let path=Date.now()+'-'+crypto.randomUUID()+'-'+file.name.replace(/[^a-zA-Z0-9._-]/g,'_'),{error}=await db.storage.from('renesa-products').upload(path,file,{contentType:file.type});if(error)throw error;return db.storage.from('renesa-products').getPublicUrl(path).data.publicUrl}
$('productForm').onsubmit=async e=>{e.preventDefault();let f=e.target,d=new FormData(f);$('save').disabled=true;try{let image_url=await upload(d.get('image').size?d.get('image'):null),row={name:String(d.get('name')).trim(),price:Number(d.get('price')),old_price:d.get('old_price')?Number(d.get('old_price')):null,stock:Number(d.get('stock')),category:d.get('category'),description:String(d.get('description')||'').trim(),is_active:true};if(image_url)row.image_url=image_url;if(editId){let {error}=await db.from('products').update(row).eq('id',editId);if(error)throw error}else{row.image_url=row.image_url||'https://placehold.co/400x300?text=RENESA';let {error}=await db.from('products').insert(row);if(error)throw error}$('productMsg').textContent=editId?'পণ্য আপডেট হয়েছে।':'পণ্য যোগ হয়েছে।';f.reset();editId=null;$('save').textContent='পণ্য যোগ করুন';$('cancel').classList.add('hidden');await loadProducts()}catch(err){console.error(err);$('productMsg').textContent='কাজ হয়নি: '+err.message}finally{$('save').disabled=false}};async function del(id){if(!confirm('পণ্যটি মুছবেন?'))return;let {error}=await db.from('products').delete().eq('id',id);if(error){$('productMsg').textContent=error.message;return}await loadProducts()}
async function loadOrders(){let {data,error}=await db.from('orders').select('*').order('created_at',{ascending:false}).limit(100);if(error){$('orderMsg').textContent=error.message;return}$('orders').innerHTML=(data||[]).map(o=>`<tr><td>#${o.id}<br><small>${new Date(o.created_at).toLocaleString('bn-BD')}</small></td><td>${esc(o.customer_name)}</td><td>${esc(o.phone)}<br>${esc(o.address)}</td><td>${(o.items||[]).map(i=>esc(i.name)+' × '+i.quantity).join('<br>')}<br><b>${money(o.total)}</b></td><td>${esc(o.status)}</td><td><select data-s="${o.id}"><option value="pending" ${o.status==='pending'?'selected':''}>Pending</option><option value="confirmed" ${o.status==='confirmed'?'selected':''}>Confirmed</option><option value="processing" ${o.status==='processing'?'selected':''}>Processing</option><option value="shipped" ${o.status==='shipped'?'selected':''}>Shipped</option><option value="delivered" ${o.status==='delivered'?'selected':''}>Delivered</option><option value="cancelled" ${o.status==='cancelled'?'selected':''}>Cancelled</option></select><button data-save="${o.id}" style="margin-top:5px">Save</button></td></tr>`).join('');$('orders').querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{let id=b.dataset.save,status=$('orders').querySelector(`[data-s="${id}"]`).value,{error}=await db.from('orders').update({status}).eq('id',id);$('orderMsg').textContent=error?'Update হয়নি: '+error.message:'Order #'+id+' update হয়েছে';if(!error)loadOrders()})}init();
</script></body></html>
