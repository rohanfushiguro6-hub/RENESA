<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RENESA | Online Shop</title><style>
:root{--r:#d71920;--bg:#f5f6f8;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,Arial,sans-serif;color:#20242b}button,input,textarea{font:inherit}button{border:0;border-radius:8px;background:var(--r);color:white;padding:10px 14px;font-weight:700;cursor:pointer}header{background:white;padding:16px 4%;display:flex;gap:18px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:2;box-shadow:0 2px 8px #0001}.logo{font-size:28px;font-weight:900;color:var(--r);text-decoration:none}.search{display:flex;flex:1;min-width:180px}.search input{flex:1;min-width:0;border:1px solid var(--line);padding:12px;border-radius:8px 0 0 8px}.search button{border-radius:0 8px 8px 0}.wrap{max-width:1200px;margin:22px auto;padding:0 16px}.hero{background:linear-gradient(110deg,#9d1118,#ed333b);color:white;border-radius:16px;padding:32px;display:flex;align-items:center;justify-content:space-between}.hero h1{margin:0 0 8px;font-size:clamp(26px,4vw,42px)}.hero p{margin:0 0 18px}.white{background:white;color:var(--r)}.cats{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.cat{background:white;color:#333;border:1px solid var(--line);border-radius:30px}.cat.active{background:#ffe4e6;color:#b91c1c}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}.card img{width:100%;height:180px;object-fit:contain;padding:10px}.body{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}.name{font-weight:700;min-height:42px}.price{color:var(--r);font-size:19px;font-weight:850}.empty{background:white;padding:28px;text-align:center;border-radius:10px;grid-column:1/-1}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:4;align-items:center;justify-content:center;padding:12px}.modal.open{display:flex}.dialog{background:white;border-radius:14px;padding:22px;width:min(560px,100%);max-height:92vh;overflow:auto}.form{display:grid;gap:10px}.form input,.form textarea{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:8px}.item{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}.secondary{background:#e5e7eb;color:#111}.note{font-size:13px;color:#64748b}footer{background:#20242b;color:#ddd;margin-top:35px;padding:25px 4%}@media(max-width:850px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card img{height:135px}.hero{padding:22px}.hero .emoji{display:none}}
</style></head><body><header><a class="logo" href="./">RENESA</a><form class="search" id="searchForm"><input id="search" placeholder="পণ্য খুঁজুন..."><button>Search</button></form><button id="cartOpen">🛒 কার্ট (<span id="count">0</span>)</button></header><main class="wrap"><section class="hero"><div><h1>আপনার পছন্দ, RENESA-তে</h1><p>বাংলাদেশের জন্য সহজ অনলাইন শপিং</p><button class="white" onclick="document.querySelector('#productTitle').scrollIntoView({behavior:'smooth'})">কেনাকাটা শুরু করুন</button></div><div class="emoji" style="font-size:70px">🛍️</div></section><h2>ক্যাটাগরি</h2><div class="cats" id="cats"><button class="cat active" data-cat="সব">সব পণ্য</button><button class="cat" data-cat="ইলেকট্রনিক্স">ইলেকট্রনিক্স</button><button class="cat" data-cat="ফ্যাশন">ফ্যাশন</button><button class="cat" data-cat="বিউটি">বিউটি</button><button class="cat" data-cat="হোম">হোম</button><button class="cat" data-cat="অন্যান্য">অন্যান্য</button></div><h2 id="productTitle">সব পণ্য</h2><div class="grid" id="products"><div class="empty">Supabase সংযোগ করার পর পণ্য এখানে দেখা যাবে।</div></div></main><footer><b>RENESA</b><p>বাংলাদেশের অনলাইন শপ | প্রথম সংস্করণে Cash on Delivery (COD)</p></footer>
<div class="modal" id="cartModal"><div class="dialog"><h2>আপনার কার্ট</h2><div id="cartItems"></div><p><b>মোট: <span id="total">৳0</span></b></p><h3>অর্ডারের তথ্য</h3><form id="orderForm" class="form"><input name="customer_name" placeholder="আপনার নাম" required maxlength="100"><input name="phone" placeholder="মোবাইল নম্বর" required maxlength="25"><textarea name="address" placeholder="সম্পূর্ণ ঠিকানা, জেলা সহ" required maxlength="500" rows="3"></textarea><textarea name="note" placeholder="অতিরিক্ত নির্দেশনা (ঐচ্ছিক)" maxlength="300"></textarea><p class="note">পেমেন্ট: Cash on Delivery (COD)</p><div style="display:flex;justify-content:flex-end;gap:8px"><button type="button" class="secondary" id="cartClose">বন্ধ করুন</button><button id="submitOrder">অর্ডার করুন</button></div></form></div></div><div class="modal" id="msgModal"><div class="dialog"><h3 id="msgTitle">বার্তা</h3><p id="msgText"></p><button id="msgClose">ঠিক আছে</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
// এখানে নিজের Supabase Project URL ও publishable key বসান। Secret/service_role key দেবেন না।
const SUPABASE_URL='YOUR_SUPABASE_URL';const SUPABASE_PUBLISHABLE_KEY='YOUR_SUPABASE_PUBLISHABLE_KEY';
const ready=SUPABASE_URL.startsWith('https://')&&!SUPABASE_URL.includes('YOUR_')&&SUPABASE_PUBLISHABLE_KEY.length>25&&!SUPABASE_PUBLISHABLE_KEY.includes('YOUR_');const db=ready?supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY):null;
let products=[],category='সব',term='',cart=JSON.parse(localStorage.getItem('renesa_cart')||'[]');const money=n=>'৳'+Number(n||0).toLocaleString('en-BD',{maximumFractionDigits:2});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function message(t,m){document.getElementById('msgTitle').textContent=t;document.getElementById('msgText').textContent=m;document.getElementById('msgModal').classList.add('open')}
function saveCart(){localStorage.setItem('renesa_cart',JSON.stringify(cart));document.getElementById('count').textContent=cart.reduce((s,x)=>s+x.qty,0)}function render(){let list=products.filter(p=>(category==='সব'||p.category===category)&&(`${p.name} ${p.description||''}`).toLowerCase().includes(term.toLowerCase()));let el=document.getElementById('products');if(!list.length){el.innerHTML='<div class="empty">পণ্য পাওয়া যায়নি। Admin Panel থেকে পণ্য যোগ করুন।</div>';return}el.innerHTML=list.map(p=>`<article class="card"><img src="${esc(p.image_url||'https://placehold.co/400x300?text=RENESA')}" alt="${esc(p.name)}"><div class="body"><div class="name">${esc(p.name)}</div><div class="price">${money(p.price)}</div><div class="note">স্টক: ${p.stock}</div><button data-add="${p.id}" ${p.stock<1?'disabled':''}>কার্টে যোগ করুন</button></div></article>`).join('');el.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add))}
function add(id){let p=products.find(x=>String(x.id)===String(id));if(!p)return;let x=cart.find(x=>String(x.id)===String(id));if(x){if(x.qty>=p.stock)return message('স্টক সীমা','এই পরিমাণ পণ্য স্টকে নেই।');x.qty++}else cart.push({id:p.id,name:p.name,price:Number(p.price),qty:1,stock:Number(p.stock)});saveCart();message('কার্টে যোগ হয়েছে',p.name+' কার্টে যোগ হয়েছে।')}
function renderCart(){let el=document.getElementById('cartItems');if(!cart.length)el.innerHTML='<div class="empty">কার্ট খালি।</div>';else el.innerHTML=cart.map(x=>`<div class="item"><span>${esc(x.name)}<br>${money(x.price)} × ${x.qty}</span><span><button class="secondary" data-minus="${x.id}">−</button> <button data-plus="${x.id}">+</button> <button class="secondary" data-remove="${x.id}">×</button></span></div>`).join('');document.getElementById('total').textContent=money(cart.reduce((s,x)=>s+x.price*x.qty,0));el.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>qty(b.dataset.minus,-1));el.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>qty(b.dataset.plus,1));el.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart=cart.filter(x=>String(x.id)!==String(b.dataset.remove));saveCart();renderCart()})}function qty(id,d){let x=cart.find(x=>String(x.id)===String(id));if(!x)return;if(d>0&&x.qty>=x.stock)return message('স্টক সীমা','আর স্টক নেই।');x.qty+=d;if(x.qty<1)cart=cart.filter(y=>String(y.id)!==String(id));saveCart();renderCart()}
async function load(){if(!db){document.getElementById('products').innerHTML='<div class="empty">index.html-এ Supabase URL এবং publishable key বসাতে হবে।</div>';return}let {data,error}=await db.from('products').select('id,name,description,price,image_url,category,stock').eq('is_active',true).order('created_at',{ascending:false});if(error){console.error(error);document.getElementById('products').innerHTML='<div class="empty">পণ্য লোড হয়নি। Supabase SQL ও RLS policy যাচাই করুন।</div>';return}products=data||[];render()}
document.getElementById('searchForm').onsubmit=e=>{e.preventDefault();term=document.getElementById('search').value;render()};document.getElementById('search').oninput=e=>{term=e.target.value;render()};document.getElementById('cats').onclick=e=>{let b=e.target.closest('[data-cat]');if(!b)return;category=b.dataset.cat;document.querySelectorAll('.cat').forEach(x=>x.classList.toggle('active',x===b));render()};document.getElementById('cartOpen').onclick=()=>{renderCart();document.getElementById('cartModal').classList.add('open')};document.getElementById('cartClose').onclick=()=>document.getElementById('cartModal').classList.remove('open');document.getElementById('msgClose').onclick=()=>document.getElementById('msgModal').classList.remove('open');
document.getElementById('orderForm').onsubmit=async e=>{e.preventDefault();if(!db)return message('Supabase সংযোগ নেই','প্রথমে Supabase URL ও key বসান।');if(!cart.length)return message('কার্ট খালি','আগে পণ্য যোগ করুন।');let f=new FormData(e.target),total=cart.reduce((s,x)=>s+x.price*x.qty,0),items=cart.map(x=>({product_id:x.id,name:x.name,unit_price:x.price,quantity:x.qty}));let b=document.getElementById('submitOrder');b.disabled=true;let {data,error}=await db.from('orders').insert({customer_name:f.get('customer_name').trim(),phone:f.get('phone').trim(),address:f.get('address').trim(),note:f.get('note').trim(),items,total,status:'pending',payment_method:'COD'}).select('id').single();b.disabled=false;if(error){console.error(error);return message('অর্ডার জমা হয়নি','Supabase SQL/policy যাচাই করে আবার চেষ্টা করুন।')}cart=[];saveCart();e.target.reset();document.getElementById('cartModal').classList.remove('open');message('অর্ডার সফল','আপনার অর্ডার নম্বর: '+data.id+'। নম্বরটি সংরক্ষণ করুন।')};load();saveCart();
</script></body></html>
